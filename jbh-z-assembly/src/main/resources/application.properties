# ===============================================
# SERVER CONFIGURATION
# ===============================================
quarkus.http.port=7777
# Bind to all interfaces so Consul (in Docker) can reach health check endpoint
quarkus.http.host=0.0.0.0
# ===============================================
# SEVER/APPLICATION CONFIGURATION
# ===============================================
# Debug logging
quarkus.log.category."com.jbh.**".level=DEBUG
quarkus.log.category."io.quarkus.arc".level=INFO
# ===============================================
# CDI CONFIGURATION
# ===============================================
quarkus.arc.remove-unused-beans=false
quarkus.arc.unremovable-types=com.jbh.**,**.jbh.**
# ===============================================
# JANDEX INDEX CONFIGURATION
# Index domain, application, and contracts modules for reflection/OpenAPI
# This keeps these layers framework-agnostic (no Quarkus coupling)
# ===============================================
# Products module
quarkus.index-dependency.products-domain.group-id=com.jbh
quarkus.index-dependency.products-domain.artifact-id=jbh-finance-domain
quarkus.index-dependency.products-application.group-id=com.jbh
quarkus.index-dependency.products-application.artifact-id=jbh-finance-application
# Preferences module
quarkus.index-dependency.preferences-domain.group-id=com.jbh
quarkus.index-dependency.preferences-domain.artifact-id=jbh-preferences-domain
quarkus.index-dependency.preferences-application.group-id=com.jbh
quarkus.index-dependency.preferences-application.artifact-id=jbh-preferences-application
quarkus.index-dependency.preferences-contracts.group-id=com.jbh
quarkus.index-dependency.preferences-contracts.artifact-id=jbh-preferences-contracts
# Notification module
quarkus.index-dependency.notification-contracts.group-id=com.jbh
quarkus.index-dependency.notification-contracts.artifact-id=jbh-notification-contracts
# ===============================================
# OPENAPI CONFIGURATION
# ===============================================
quarkus.smallrye-openapi.info-title=JBH Modular Application API
quarkus.smallrye-openapi.info-version=${project.version}
quarkus.smallrye-openapi.info-description=Personal Finance Management System
quarkus.smallrye-openapi.scan-classes=true
quarkus.smallrye-openapi.auto-add-servers=true
# Enable security scheme globally
quarkus.smallrye-openapi.security-scheme=JWT
quarkus.smallrye-openapi.security-scheme-name=JWT
quarkus.smallrye-openapi.jwt=true
# ===============================================
# DATABASE CONFIGURATION
# ===============================================
# Default datasource (shared connection info)
%prod.quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USERNAME:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jbh_finance}
# ===============================================
# CONSUL SERVICE DISCOVERY CONFIGURATION
# ===============================================
consul.enabled=${CONSUL_ENABLED:true}
consul.host=${CONSUL_HOST:localhost}
consul.port=${CONSUL_PORT:8500}
consul.service.name=jbh-personal-finance
consul.service.tags=personal-finance,modular-monolith
consul.health-check.path=/q/health
consul.health-check.interval=30s
consul.prefer-ip-address=${CONSUL_PREFER_IP:true}



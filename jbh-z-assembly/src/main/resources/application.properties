# ===============================================
# SERVER CONFIGURATION
# ===============================================
quarkus.http.port=7777
# Bind to all interfaces so Consul (in Docker) can reach health check endpoint
quarkus.http.host=0.0.0.0
# Uploads go to /tmp: the container file system is read-only except /tmp.
quarkus.http.body.uploads-directory=/tmp/jbh-uploads
# Delete an uploaded file when the response is sent. Bank statements must not stay on disk.
quarkus.http.body.delete-uploaded-files-on-end=true
# ===============================================
# SEVER/APPLICATION CONFIGURATION
# ===============================================
# com.jbh logs DEBUG in dev and INFO in prod. test uses the Quarkus default (INFO).
%dev.quarkus.log.category."com.jbh.**".level=DEBUG
%prod.quarkus.log.category."com.jbh.**".level=INFO
quarkus.log.category."io.quarkus.arc".level=INFO
# ===============================================
# CDI CONFIGURATION
# ===============================================
quarkus.arc.remove-unused-beans=false
quarkus.arc.unremovable-types=com.jbh.**,**.jbh.**
# ===============================================
# JANDEX INDEX CONFIGURATION
# Index domain, application, and contracts modules for reflection/OpenAPI
# This keeps these layers framework-agnostic (no Quarkus coupling)
# ===============================================
# Products module
quarkus.index-dependency.products-domain.group-id=com.jbh
quarkus.index-dependency.products-domain.artifact-id=jbh-finance-domain
quarkus.index-dependency.products-application.group-id=com.jbh
quarkus.index-dependency.products-application.artifact-id=jbh-finance-application
# Preferences module
quarkus.index-dependency.preferences-domain.group-id=com.jbh
quarkus.index-dependency.preferences-domain.artifact-id=jbh-preferences-domain
quarkus.index-dependency.preferences-application.group-id=com.jbh
quarkus.index-dependency.preferences-application.artifact-id=jbh-preferences-application
quarkus.index-dependency.preferences-contracts.group-id=com.jbh
quarkus.index-dependency.preferences-contracts.artifact-id=jbh-preferences-contracts
# Notification module
quarkus.index-dependency.notification-contracts.group-id=com.jbh
quarkus.index-dependency.notification-contracts.artifact-id=jbh-notification-contracts
# ===============================================
# OPENAPI CONFIGURATION
# ===============================================
quarkus.smallrye-openapi.info-title=JBH Modular Application API
quarkus.smallrye-openapi.info-version=${project.version}
quarkus.smallrye-openapi.info-description=Personal Finance Management System
# Enable security scheme globally
quarkus.smallrye-openapi.security-scheme=JWT
quarkus.smallrye-openapi.security-scheme-name=JWT
# ===============================================
# DATABASE CONFIGURATION
# ===============================================
# Default datasource (shared connection info)
%prod.quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USERNAME:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD}
# Local default only in dev and test. Prod must set DATABASE_PASSWORD.
%dev.quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
%test.quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jbh_finance}
# Keeps the pool size of Quarkus 3.18. The default is 50 since Quarkus 3.31.
quarkus.datasource.jdbc.max-size=20
# ===============================================
# CONSUL SERVICE DISCOVERY CONFIGURATION
# ===============================================
consul.enabled=${CONSUL_ENABLED:true}
consul.host=${CONSUL_HOST:localhost}
consul.port=${CONSUL_PORT:8500}
consul.service.name=jbh-personal-finance
consul.service.tags=personal-finance,modular-monolith
consul.health-check.path=/q/health
consul.health-check.interval=30s
consul.health-check.host=${CONSUL_HEALTH_CHECK_HOST:}
consul.service.address=${CONSUL_DISCOVERY_HOSTNAME:}
%dev.consul.health-check.host=${CONSUL_HEALTH_CHECK_HOST:host.docker.internal}
consul.prefer-ip-address=${CONSUL_PREFER_IP:true}
# ===============================================
# OBSERVABILITY (logs, traces, metrics)
# ===============================================
# Service name used by OpenTelemetry and the metric tag "service".
quarkus.application.name=jbh-personal-finance
# JSON console logs only in prod. The extension turns JSON on by default, so the base value is false.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
# MDC entries (trackingId, userId, traceId, spanId) become top-level JSON fields.
quarkus.log.console.json.mdc.flat-fields=true
# The SDK is off until OTEL_SDK_DISABLED=false. Off means no export and no exporter errors.
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
# OTLP gRPC endpoint of the collector (Alloy in prod).
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
# Honor the parent sampling decision; sample by trace id ratio.
quarkus.otel.traces.sampler=${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
# 1.0 = sample every trace.
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:1.0}
# Publish Agroal datasource metrics on /q/metrics.
quarkus.datasource.metrics.enabled=true
# Value of the metric tag "env". Dev and test never mix with prod.
jbh.metrics.env=prod
%dev.jbh.metrics.env=dev
%test.jbh.metrics.env=test
# Local Grafana LGTM stack (dev only): off unless QUARKUS_OBSERVABILITY_ENABLED=true.
quarkus.observability.enabled=false

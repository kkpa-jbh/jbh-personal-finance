notification.api.base-path=/jbh-notifications/api
# DATABASE CONFIGURATION
jbh.schema.name.notifications=notifications
quarkus.datasource.notifications.db-kind=postgresql
quarkus.datasource.notifications.username=${DATABASE_USERNAME:postgres}
quarkus.datasource.notifications.password=${DATABASE_PASSWORD:postgres}
quarkus.datasource.notifications.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jbh_finance}?currentSchema=notifications
# ===============================================
# HIBERNATE ORM CONFIGURATION
# ===============================================
quarkus.hibernate-orm.notifications.datasource=notifications
quarkus.hibernate-orm.notifications.packages=com.jbh.notification.infra.persistence
%dev.quarkus.hibernate-orm.notifications.database.generation=none
%prod.quarkus.hibernate-orm.notifications.database.generation=none
# ===============================================
# LIQUIBASE CONFIGURATION
# ===============================================
quarkus.liquibase.notifications.liquibase-schema-name=notifications
quarkus.liquibase.notifications.schemas=notifications
# Notifications Liquibase
quarkus.liquibase.notifications.change-log=db/notificationdb-master.xml
quarkus.liquibase.notifications.datasource=notifications
quarkus.liquibase.notifications.migrate-at-start=true
# ===============================================
# MAILER CONFIGURATION
# ===============================================
# DEV PROFILE - Mock mailer by default (emails logged to console, not sent)
# Emails are printed to console instead of being sent - perfect for local development
%dev.quarkus.mailer.mock=false
# REAL-EMAIL PROFILE - Use this to test with real Gmail SMTP locally
# Activate with: mvn quarkus:dev -Dquarkus.profile=dev,real-email
# Or set environment variable: export QUARKUS_PROFILE=dev,real-email
%real-email.quarkus.mailer.mock=true
# PROD PROFILE - Real email sending (mock disabled)
%prod.quarkus.mailer.mock=false
# Gmail SMTP Configuration (used when mock=false)
# Setup instructions:
# 1. Enable 2-Factor Authentication on your Google Account
# 2. Go to: Google Account > Security > 2-Step Verification > App Passwords
# 3. Generate a new App Password for "Mail"
# 4. Set environment variables:
#    export GMAIL_USERNAME=your-email@gmail.com
#    export GMAIL_APP_PASSWORD=your-16-char-app-password
quarkus.mailer.auth-methods=DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN
quarkus.mailer.from=${GMAIL_FROM:noreply@jbh-finance.com}
quarkus.mailer.host=${GMAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${GMAIL_PORT:465}
quarkus.mailer.tls=true
quarkus.mailer.username=${GMAIL_USERNAME:whoknows}
quarkus.mailer.password=${GMAIL_APP_PASSWORD:omgpassword}
# ===============================================
# FRONTEND URL CONFIGURATION
# ===============================================
# Used for generating links in emails (accept invitation, etc.)
%dev.jbh.frontend.url=http://localhost:4200
# The %prod key wins over the plain JBH_FRONTEND_URL, so it must read the env var itself.
%prod.jbh.frontend.url=${JBH_FRONTEND_URL:https://jbh.usemagus.cloud}
jbh.frontend.url=${JBH_FRONTEND_URL:http://localhost:4200}
# ===============================================
# QUTE TEMPLATING CONFIGURATION
# ===============================================
quarkus.qute.property-not-found-strategy=throw-exception
quarkus.qute.remove-standalone-lines=true
quarkus.default-locale=es
quarkus.locales=en,es
# ===============================================
# LOGGING CONFIGURATION
# ===============================================
quarkus.log.category."com.jbh.notification".level=DEBUG
%prod.quarkus.log.category."com.jbh.notification".level=INFO

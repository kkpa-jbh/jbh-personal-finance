# Builds the jbh-personal-finance image and pushes it to GHCR, tagged with the git SHA.
# The VPS only pulls this image. It never builds Maven itself.
name: Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Tests run in ci.yml. This job only packages the fast-jar.
      - name: Package Quarkus app
        run: mvn -B -s .github/maven-settings.xml -Pgithub -pl jbh-z-assembly -am -DskipTests package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: jbh-z-assembly
          push: true
          tags: |
            ghcr.io/kkpa-jbh/jbh-personal-finance:${{ github.sha }}
            ghcr.io/kkpa-jbh/jbh-personal-finance:latest

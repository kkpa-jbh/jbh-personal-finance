name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests with static analysis
      run: |
        mvn clean verify \
          -Dpmd.failOnViolation=true \
          -Dspotbugs.failOnError=true
      
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: '**/target/surefire-reports/TEST-*.xml'
        reporter: java-junit

    - name: Upload PMD results
      uses: github/super-linter/slim@v5
      if: always()
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_JAVA_PMD: true
        PMD_CONFIG_FILE: pmd-ruleset.xml

    - name: Upload SpotBugs results
      if: always()
      run: |
        find . -name "spotbugsXml.xml" -exec echo "SpotBugs report found: {}" \;
        
    - name: Comment PR with analysis results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let comment = '## 📊 Static Analysis Results\n\n';
          
          // Check for PMD violations
          try {
            const pmdFiles = require('glob').sync('**/target/pmd.xml');
            if (pmdFiles.length > 0) {
              comment += '### PMD Analysis\n';
              comment += `Found ${pmdFiles.length} module(s) analyzed\n\n`;
            }
          } catch (e) {
            console.log('PMD files not found');
          }
          
          // Check for SpotBugs violations  
          try {
            const spotbugsFiles = require('glob').sync('**/target/spotbugsXml.xml');
            if (spotbugsFiles.length > 0) {
              comment += '### SpotBugs Analysis\n';
              comment += `Found ${spotbugsFiles.length} module(s) analyzed\n\n`;
            }
          } catch (e) {
            console.log('SpotBugs files not found');
          }
          
          comment += '✅ Build completed with static analysis checks\n';
          comment += 'Review detailed reports in the Actions artifacts.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  security-scan:
    runs-on: ubuntu-latest
    needs: test-and-analyze
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
# CI: builds and checks the code on every push and every pull request into main or develop.
# It runs the same checks as "mvn clean verify" on your laptop: compile, the tests, PMD and SpotBugs.
# Then a second job scans the dependencies for known security problems (Trivy).
# If a check fails, the commit or the PR shows a red X. This workflow publishes nothing.
#
# How GitHub Actions works, in short:
#   - A "workflow" is one YAML file in .github/workflows/. GitHub reads every file there.
#   - "on" says WHEN the workflow starts (an event: a push, a PR, a click by hand).
#   - "jobs" says WHAT runs. Each job gets a fresh, empty virtual machine (a "runner").
#   - A job has "steps". A step either runs a shell command ("run") or uses a ready-made
#     action from GitHub's marketplace ("uses").

# The name shown in the GitHub "Actions" tab and in the PR checks list.
name: CI Pipeline

on:
  # Runs on every push to main or develop (for example, after a PR is merged).
  push:
    branches: [ main, develop ]
  # Runs when a PR into main or develop is opened, gets new commits, or is reopened.
  pull_request:
    branches: [ main, develop ]

# What the automatic GITHUB_TOKEN may do in this run. Every permission not listed is "none".
permissions:
  # Read the code.
  contents: read
  # Read Maven packages from GitHub Packages.
  packages: read
  # Write the test results as a "check" (dorny/test-reporter).
  checks: write
  # Post the analysis comment on the PR (actions/github-script).
  pull-requests: write
  # Read workflow run data (used by the reporting actions).
  actions: read

jobs:
  # Job 1: build, tests and static analysis (PMD, SpotBugs).
  # "test-and-analyze" is the job id. It shows in the PR checks list.
  test-and-analyze:
    # The machine type. GitHub gives a clean Ubuntu VM for each run and deletes it after.
    runs-on: ubuntu-latest

    steps:
      # The VM starts empty. This step downloads the commit's code into it.
      - name: Checkout code
        uses: actions/checkout@v7

      # Installs Java 21 (Eclipse Temurin build). Quarkus and this project need it.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Saves ~/.m2 (the local Maven repository) between runs, so Maven does not download
      # every dependency again. The key changes when any pom.xml changes.
      # restore-keys: if there is no exact match, take the newest cache that starts with this text.
      # This is the only ~/.m2 cache: the security-scan job restores it by the same key.
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # The real check: compile, test, package, then verify (PMD and SpotBugs, see pom.xml).
      # The build fails when PMD finds a violation or SpotBugs finds a bug.
      - name: Run tests with static analysis
        # The two tokens are read by .github/maven-settings.xml:
        #   GITHUB_TOKEN        - automatic token of this run (server id "github").
        #   PACKAGES_READ_TOKEN - repo secret, a classic token with read:packages.
        #                         It reads the packages of other kkpa-jbh repos.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        # ./mvnw: the Maven wrapper, so CI uses the same Maven version as the repo.
        # -U: the ~/.m2 cache is restored, so force a check for a newer SNAPSHOT.
        # -s .github/maven-settings.xml: the CI settings file with the two tokens above.
        # -Pgithub: JBH packages (for example jbh-gateway-client) come from GitHub Packages,
        #   not ~/.m2. The package URLs are in the "github" profile of pom.xml.
        # clean verify: delete old build output, then run every phase up to verify.
        # -Dpmd.failOnViolation=true: a PMD violation fails the build.
        # -Dspotbugs.failOnError=true: a SpotBugs bug fails the build.
        # -Djbh.test.excludedGroups=none: also run the "database" tests. They start PostgreSQL in Docker.
        run: |
          ./mvnw -U -s .github/maven-settings.xml -Pgithub clean verify \
            -Dpmd.failOnViolation=true \
            -Dspotbugs.failOnError=true \
            -Djbh.test.excludedGroups=none

      # Turns the JUnit XML files into a readable test report ("Maven Tests" check).
      # if: success() || failure() - run also when the tests failed, but not when the run was cancelled.
      - name: Generate test report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit

      # Shows the line coverage per module in the job summary page.
      # mvn verify already writes target/site/jacoco/jacoco.csv in each module with JaCoCo.
      # The script reads every jacoco.csv, adds up the lines, and writes a table
      # to $GITHUB_STEP_SUMMARY (the file GitHub shows as the summary).
      - name: Coverage summary
        if: success() || failure()
        run: |
          {
            echo "## Line coverage (JaCoCo)"
            echo ""
            echo "| Module | Lines covered | Coverage |"
            echo "|---|---|---|"
            find . -path '*/target/site/jacoco/jacoco.csv' | sort | while read -r csv; do
              module=$(echo "$csv" | sed -E 's|^\./||; s|/target/site/jacoco/jacoco.csv$||')
              # Columns 8 and 9 are LINE_MISSED and LINE_COVERED.
              awk -F, -v m="$module" 'NR > 1 { miss += $8; cov += $9 }
                END { total = miss + cov; pct = total ? 100 * cov / total : 0;
                      printf "| %s | %d / %d | %.1f%% |\n", m, cov, total, pct }' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Keeps the HTML coverage reports as a downloadable artifact for 30 days.
      - name: Archive coverage reports
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          retention-days: 30

      # Keeps the PMD reports for 30 days.
      # if: always() - run in every case, also when the build failed or was cancelled.
      - name: Archive PMD reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pmd-reports
          path: '**/target/pmd.xml'
          retention-days: 30

      # Keeps the SpotBugs reports for 30 days, in every case.
      - name: Archive SpotBugs reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotbugs-reports
          path: '**/target/spotbugsXml.xml'
          retention-days: 30

      # Diagnostic only: prints every SpotBugs report it finds, so you can see in the log
      # that SpotBugs really ran.
      - name: Verify SpotBugs reports
        if: always()
        run: |
          echo "🔍 Looking for SpotBugs reports..."
          find . -name "spotbugsXml.xml" -exec echo "✅ SpotBugs report found: {}" \;

      # Posts a short comment on the PR: how many modules PMD and SpotBugs checked.
      # Runs only for pull requests, not for pushes.
      # actions/github-script runs JavaScript with a ready GitHub API client ("github")
      # that uses the automatic GITHUB_TOKEN.
      - name: Comment PR with analysis results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let comment = '## 📊 Static Analysis Results\n\n';

            // Check for PMD violations across all modules
            try {
              const pmdFiles = require('glob').sync('**/target/pmd.xml');
              if (pmdFiles.length > 0) {
                comment += '### 🔍 PMD Analysis\n';
                comment += `Found ${pmdFiles.length} module(s) analyzed\n\n`;
              }
            } catch (e) {
              console.log('PMD files not found');
            }

            // Check for SpotBugs violations across all modules
            try {
              const spotbugsFiles = require('glob').sync('**/target/spotbugsXml.xml');
              if (spotbugsFiles.length > 0) {
                comment += '### 🐛 SpotBugs Analysis\n';
                comment += `Found ${spotbugsFiles.length} module(s) analyzed\n\n`;
              }
            } catch (e) {
              console.log('SpotBugs files not found');
            }

            comment += '✅ Build completed with static analysis checks\n';
            comment += '📁 Review detailed reports in the Actions artifacts.\n';
            comment += '✅ JBH is ready for deployment!';

            // Post comment to the pull request
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Job 2: security scan of the dependencies and the code (Trivy).
  security-scan:
    runs-on: ubuntu-latest
    # needs: starts only after test-and-analyze ends with success.
    needs: test-and-analyze

    steps:
      # A new VM, so download the code again. Trivy scans the files.
      - name: Checkout code
        uses: actions/checkout@v7

      # Restores the ~/.m2 cache that test-and-analyze saved (same key). Restore only, no save.
      # Trivy reads parent POMs from it instead of downloading them.
      - name: Restore Maven dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Scans for known vulnerabilities and prints a table in the build log.
      # The action is pinned to a commit SHA (v0.36.0), so a changed tag cannot change what runs.
      # TRIVY_OFFLINE_SCAN: no calls to Maven Central. It blocks shared runner IPs
      # with "429 Too Many Requests". A POM missing from ~/.m2 is skipped.
      # scan-type 'fs': scan the file system (the checked-out repo). scan-ref '.': from the repo root.
      # exit-code '0': report only. A finding does not fail the job.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'

      # The same scan again, written as JSON to trivy-results.json (for the artifact below).
      - name: Generate Trivy report file
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'

      # Keeps the JSON report as a downloadable artifact for 30 days, in every case.
      - name: Archive Trivy security report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-security-report
          path: trivy-results.json
          retention-days: 30

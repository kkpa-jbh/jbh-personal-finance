# CI Pipeline for JBH Personal Finance Platform
# Runs comprehensive testing, static analysis, and security scans
name: CI Pipeline

# Trigger on pushes to main/develop and all pull requests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Set permissions for GITHUB_TOKEN to enable test reporting and security uploads
permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  # Job 1: Run tests and static analysis (PMD, SpotBugs)
  test-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Download source code from repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Install Java 21 (required for Quarkus and project)
    # Uses Eclipse Temurin JDK distribution with Maven dependency caching
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Step 3: Cache Maven dependencies to speed up subsequent builds
    # Caches ~/.m2 (Maven local repository) based on pom.xml changes
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    # Step 4: Run Maven verify phase (includes tests, PMD, SpotBugs)
    # This executes: compile → test → package → verify (with PMD & SpotBugs)
    # Fails build if PMD finds violations or SpotBugs finds bugs
    - name: Run tests with static analysis
      run: |
        mvn clean verify \
          -Dpmd.failOnViolation=true \
          -Dspotbugs.failOnError=true
      
    # Step 5: Generate human-readable test reports from JUnit XML
    # Runs even if tests fail to provide visibility into test results
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: '**/target/surefire-reports/TEST-*.xml'
        reporter: java-junit

    # Step 6: Archive PMD analysis reports as build artifacts
    # Always uploads PMD reports (even on build failure) for 30 days
    - name: Archive PMD reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pmd-reports
        path: '**/target/pmd.xml'
        retention-days: 30

    # Step 7: Archive SpotBugs analysis reports as build artifacts
    # Always uploads SpotBugs reports (even on build failure) for 30 days
    - name: Archive SpotBugs reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spotbugs-reports
        path: '**/target/spotbugsXml.xml'
        retention-days: 30

    # Step 8: Verify SpotBugs reports were generated (diagnostic step)
    - name: Verify SpotBugs reports
      if: always()
      run: |
        echo "🔍 Looking for SpotBugs reports..."
        find . -name "spotbugsXml.xml" -exec echo "✅ SpotBugs report found: {}" \;
        
    # Step 9: Comment on pull requests with analysis summary 
    # Only runs on PRs to provide feedback to developers
    # GITHUB_TOKEN is automatically provided by GitHub Actions
    - name: Comment PR with analysis results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let comment = '## 📊 Static Analysis Results\n\n';
          
          // Check for PMD violations across all modules
          try {
            const pmdFiles = require('glob').sync('**/target/pmd.xml');
            if (pmdFiles.length > 0) {
              comment += '### 🔍 PMD Analysis\n';
              comment += `Found ${pmdFiles.length} module(s) analyzed\n\n`;
            }
          } catch (e) {
            console.log('PMD files not found');
          }
          
          // Check for SpotBugs violations across all modules
          try {
            const spotbugsFiles = require('glob').sync('**/target/spotbugsXml.xml');
            if (spotbugsFiles.length > 0) {
              comment += '### 🐛 SpotBugs Analysis\n';
              comment += `Found ${spotbugsFiles.length} module(s) analyzed\n\n`;
            }
          } catch (e) {
            console.log('SpotBugs files not found');
          }
          
          comment += '✅ Build completed with static analysis checks\n';
          comment += '📁 Review detailed reports in the Actions artifacts.';
          
          // Post comment to the pull request
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # Job 2: Security vulnerability scanning
  # Runs after test-and-analyze job completes successfully
  security-scan:
    runs-on: ubuntu-latest
    needs: test-and-analyze
    
    steps:
    # Step 1: Download source code (needed for file system scan)
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Step 2: Scan for known vulnerabilities in dependencies and code
    # Uses file system scan to check both dependencies and source code
    # Outputs in SARIF format for GitHub Security tab integration
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    # Step 3: Upload vulnerability results to GitHub Security tab
    # Creates security alerts visible in repository's Security tab
    # Always uploads results, even if vulnerabilities are found
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
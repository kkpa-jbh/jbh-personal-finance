# DATABASE CONFIGURATION
jbh.schema.name.products=finance
quarkus.datasource.finance.db-kind=postgresql
quarkus.datasource.finance.username=${DATABASE_USERNAME:postgres}
quarkus.datasource.finance.password=${DATABASE_PASSWORD:postgres}
quarkus.datasource.finance.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jbh_finance}?currentSchema=${jbh.schema.name.products}
# ===============================================
# HIBERNATE ORM CONFIGURATION
# ===============================================
quarkus.hibernate-orm.finance.datasource=${jbh.schema.name.products}
quarkus.hibernate-orm.finance.packages=com.jbh.finance.infra.adapters.out.persistence
quarkus.hibernate-orm.finance.schema-management.create-schemas=true
%dev.quarkus.hibernate-orm.finance.database.generation=none
%prod.quarkus.hibernate-orm.finance.database.generation=none
# ===============================================
# LIQUIBASE CONFIGURATION
# ===============================================
quarkus.liquibase.finance.liquibase-schema-name=finance
quarkus.liquibase.finance.schemas=finance
# Finance Liquibase
quarkus.liquibase.finance.change-log=db/finance-db-master.xml
quarkus.liquibase.finance.datasource=finance
quarkus.liquibase.finance.migrate-at-start=true
# Gateway Client Configuration
jbh.gateway.base-url=${JBH_GATEWAY_URL:http://localhost:8080}

# Bank statement import, in 3 steps:
#   1. text source (azure or pdfbox) turns the PDF into text,
#   2. LLM (openrouter or gemini) finds the movements and balances in that text,
#   3. Jev classifies each movement.
# Keys are optional: without them the service starts, and the import endpoint answers with a clear error.
jbh.statement.max-file-size-bytes=10485760
jbh.statement.text-source=${STATEMENT_TEXT_SOURCE:azure}
jbh.statement.llm=${STATEMENT_LLM:openrouter}
# Azure AI Document Intelligence (OCR). Endpoint and key: Azure portal > the resource > Keys and Endpoint.
jbh.statement.azure.endpoint=${AZURE_DI_ENDPOINT:}
jbh.statement.azure.api-key=${AZURE_DI_API_KEY:}
jbh.statement.azure.model-id=prebuilt-layout
jbh.statement.azure.api-version=2024-11-30
# The free tier (F0) reads only the first 2 pages of each request, so the PDF is sent 2 pages at a time.
# 0 sends the whole PDF in one request (paid tier).
jbh.statement.azure.pages-per-request=${AZURE_DI_PAGES_PER_REQUEST:2}
jbh.statement.azure.timeout-seconds=60
jbh.statement.openrouter.api-key=${OPENROUTER_API_KEY:}
jbh.statement.openrouter.base-url=https://openrouter.ai/api/v1
# Tried in order. Free models that support json_schema output (check https://openrouter.ai/models).
# Override with env JBH_STATEMENT_OPENROUTER_MODELS (no ${...:default} here: model ids contain ':').
jbh.statement.openrouter.models=qwen/qwen3.8-27b:free,nvidia/nemotron-3-super-120b-a12b:free
jbh.statement.openrouter.timeout-seconds=120
jbh.statement.gemini.api-key=${GEMINI_API_KEY:}
jbh.statement.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
jbh.statement.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
jbh.statement.gemini.timeout-seconds=120
# Temporary LLM comparison (package llmcompare). When on, each import also runs every other LLM
# on the same text, in the background, and writes text files to output-dir. Off in production.
jbh.statement.compare.enabled=${STATEMENT_LLM_COMPARE:false}
jbh.statement.compare.output-dir=${STATEMENT_LLM_COMPARE_DIR:target/llm-compare}
jbh.statement.compare.ollama.api-key=${OLLAMA_API_KEY:}
jbh.statement.compare.ollama.base-url=https://ollama.com/api
# Cloud model list: https://ollama.com/api/tags. Override with env JBH_STATEMENT_COMPARE_OLLAMA_MODEL
# (no ${...:default} here: model ids contain ':').
jbh.statement.compare.ollama.model=gpt-oss:120b
jbh.statement.compare.ollama.timeout-seconds=300
jbh.statement.jev.api-key=${JEV_API_KEY:}
jbh.statement.jev.base-url=https://api.typesafe.ai
# Pinned, not jev-latest: an alias can change the answers without notice.
jbh.statement.jev.model=jev-1.13.0
jbh.statement.jev.batch-size=20
# Rows under this confidence are marked for review. Tune it with the accuracy test.
jbh.statement.jev.min-confidence=0.7
jbh.statement.jev.timeout-seconds=30
